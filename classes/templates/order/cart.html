<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>购物车</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <style>
        .cart-item {
            border-bottom: 1px solid #e5e5e5;
            padding: 15px 0;
        }
        .cart-item img {
            max-width: 100px;
            height: auto;
        }
        .quantity-input {
            width: 80px;
        }
        .total-section {
            border-top: 2px solid #333;
            padding-top: 20px;
            margin-top: 20px;
        }
        .btn-group .btn {
            border-radius: 0;
        }
        .btn-group .btn:first-child {
            border-radius: 0.375rem 0 0 0.375rem;
        }
        .btn-group .btn:last-child {
            border-radius: 0 0.375rem 0.375rem 0;
        }
        .checkout-btn {
            background: linear-gradient(135deg, #ff6b6b, #ee5a5a);
            border: none;
        }
        .checkout-btn:hover {
            background: linear-gradient(135deg, #ee5a5a, #dd4a4a);
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-light bg-light mb-5">
        <div class="container">
            <a class="navbar-brand" href="/product/list">电商平台</a>
            <div class="navbar-nav">
                <a class="nav-link" href="/product/list">商品列表</a>
                <a class="nav-link active" href="/order/cart?userId=1">购物车</a>
                <a class="nav-link" href="/order/list?userId=1">我的订单</a>
            </div>
        </div>
    </nav>
    
    <div class="container">
        <h2 class="mb-4">🛒 我的购物车</h2>
        
        <div class="cart-list">
            <div th:if="${cartList == null || cartList.isEmpty()}" class="text-center py-10">
                <div class="text-muted mb-4">
                    <svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" fill="currentColor" class="bi bi-cart-x" viewBox="0 0 24 24">
                        <path d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4m-8 2a2 2 0 11-4 0 2 2 0 014 0"/>
                    </svg>
                </div>
                <p class="text-muted">购物车为空，快去添加商品吧！</p>
                <a href="/product/list" class="btn btn-primary mt-3">去购物</a>
            </div>
            
            <div th:unless="${cartList == null || cartList.isEmpty()}">
                <!-- 批量操作 -->
                <div class="mb-4 d-flex justify-content-between align-items-center">
                    <label class="form-check-label">
                        <input type="checkbox" id="selectAll" onchange="toggleSelectAll()"> 全选
                    </label>
                    <button class="btn btn-danger" onclick="batchDelete()">删除选中</button>
                </div>
                
                <!-- 购物车列表 -->
                <div class="cart-item d-flex align-items-center" th:each="item : ${cartList}">
                    <div class="col-md-1">
                        <input type="checkbox" class="cart-checkbox item-checkbox" 
                               th:value="${item.id}" 
                               th:data-price="${item.price}" 
                               th:data-quantity="${item.quantity}"
                               onchange="calculateSelectedTotal()">
                    </div>
                    <div class="col-md-2">
                        <img th:src="@{'https://trae-api-cn.mchost.guru/api/ide/v1/text_to_image?prompt=product%20photo%20thumbnail&image_size=square'}" alt="商品图片" class="img-fluid rounded">
                    </div>
                    <div class="col-md-3">
                        <h5 th:text="${item.productName != null ? item.productName : '商品名称'}"></h5>
                    </div>
                    <div class="col-md-2">
                        <span class="text-danger font-bold unit-price" th:text="'¥' + (${item.price != null ? item.price : '0.00'})"></span>
                    </div>
                    <div class="col-md-2">
                        <div class="btn-group" role="group">
                            <button class="btn btn-sm btn-outline-secondary" type="button" th:onclick="'updateQuantity(' + ${item.id} + ', ' + ${item.quantity - 1} + ')'">-</button>
                            <input type="number" class="form-control text-center quantity-input" th:value="${item.quantity}" min="1" style="width: 60px;" onchange="updateQuantityData(this)">
                            <button class="btn btn-sm btn-outline-secondary" type="button" th:onclick="'updateQuantity(' + ${item.id} + ', ' + ${item.quantity + 1} + ')'">+</button>
                        </div>
                    </div>
                    <div class="col-md-2">
                        <span class="text-danger font-bold item-total">¥0.00</span>
                        <button class="btn btn-sm btn-danger mt-2 d-block" th:onclick="'deleteCart(' + ${item.id} + ')'">删除</button>
                    </div>
                </div>
                
                <!-- 合计 -->
                <div class="total-section d-flex justify-content-between align-items-center bg-light p-4 rounded">
                    <div class="d-flex align-items-center">
                        <span class="text-muted me-2">共 <span id="itemCount">0</span> 件商品</span>
                        <span class="text-muted">|</span>
                        <span class="text-muted mx-2">合计：</span>
                        <span class="h4 text-danger font-bold" id="totalAmount">¥0.00</span>
                    </div>
                    <div class="d-flex gap-3">
                        <button class="btn btn-outline-secondary" onclick="clearCart()">清空购物车</button>
                        <a th:href="@{/order/confirm(userId=${userId})}" class="btn btn-primary btn-lg checkout-btn">去结算</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // 页面加载完成后计算每个商品的小计
        window.onload = function() {
            calculateItemTotals();
            updateCheckoutButton();
        };
        
        // 计算每个商品的小计
        function calculateItemTotals() {
            document.querySelectorAll('.cart-item').forEach(item => {
                const unitPriceElement = item.querySelector('.unit-price');
                const quantityInput = item.querySelector('.quantity-input');
                const itemTotalElement = item.querySelector('.item-total');
                const checkbox = item.querySelector('.item-checkbox');
                
                if (unitPriceElement && quantityInput && itemTotalElement) {
                    const priceText = unitPriceElement.textContent;
                    const price = parseFloat(priceText.replace('¥', '')) || 0;
                    const quantity = parseInt(quantityInput.value) || 0;
                    const itemTotal = price * quantity;
                    
                    itemTotalElement.textContent = '¥' + itemTotal.toFixed(2);
                    
                    // 更新checkbox的数据
                    if (checkbox) {
                        checkbox.setAttribute('data-price', price);
                        checkbox.setAttribute('data-quantity', quantity);
                    }
                }
            });
        }
        
        // 计算选中商品的总金额
        function calculateSelectedTotal() {
            let total = 0;
            let count = 0;
            
            document.querySelectorAll('.item-checkbox:checked').forEach(checkbox => {
                const price = parseFloat(checkbox.getAttribute('data-price')) || 0;
                const quantity = parseInt(checkbox.getAttribute('data-quantity')) || 0;
                total += price * quantity;
                count += quantity;
            });
            
            document.getElementById('totalAmount').textContent = '¥' + total.toFixed(2);
            document.getElementById('itemCount').textContent = count;
            updateCheckoutButton();
        }
        
        // 更新数量时同步更新checkbox数据
        function updateQuantityData(input) {
            const cartItem = input.closest('.cart-item');
            const checkbox = cartItem.querySelector('.item-checkbox');
            const unitPriceElement = cartItem.querySelector('.unit-price');
            const itemTotalElement = cartItem.querySelector('.item-total');
            
            const priceText = unitPriceElement.textContent;
            const price = parseFloat(priceText.replace('¥', '')) || 0;
            const quantity = parseInt(input.value) || 0;
            
            if (checkbox) {
                checkbox.setAttribute('data-quantity', quantity);
            }
            
            itemTotalElement.textContent = '¥' + (price * quantity).toFixed(2);
            
            calculateSelectedTotal();
        }
        
        // 更新商品数量
        function updateQuantity(id, quantity) {
            if (quantity < 1) {
                deleteCart(id);
                return;
            }
            
            fetch('/order/updateCart', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/x-www-form-urlencoded'
                },
                body: 'id=' + id + '&quantity=' + quantity
            }).then(response => response.text())
              .then(data => {
                  if (data === 'success') {
                      // 重新获取页面以更新所有数据
                      location.reload();
                  }
              });
        }
        
        // 删除商品
        function deleteCart(id) {
            if (confirm('确定要删除这个商品吗？')) {
                fetch('/order/deleteCart', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/x-www-form-urlencoded'
                    },
                    body: 'id=' + id
                }).then(response => response.text())
                  .then(data => {
                      if (data === 'success') {
                          location.reload();
                      }
                  });
            }
        }
        
        // 全选/取消全选
        function toggleSelectAll() {
            const selectAllCheckbox = document.getElementById('selectAll');
            const checkboxes = document.querySelectorAll('.item-checkbox');
            
            checkboxes.forEach(checkbox => {
                checkbox.checked = selectAllCheckbox.checked;
            });
            
            calculateSelectedTotal();
        }
        
        // 批量删除选中商品
        function batchDelete() {
            const checkedBoxes = document.querySelectorAll('.item-checkbox:checked');
            
            if (checkedBoxes.length === 0) {
                alert('请先选择要删除的商品');
                return;
            }
            
            if (!confirm('确定要删除选中的商品吗？')) {
                return;
            }
            
            const ids = Array.from(checkedBoxes).map(cb => cb.value);
            
            fetch('/order/batchDeleteCart', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/x-www-form-urlencoded'
                },
                body: 'ids=' + ids.join(',')
            }).then(response => response.text())
              .then(data => {
                  if (data === 'success') {
                      location.reload();
                  }
              });
        }
        
        // 清空购物车
        function clearCart() {
            if (!confirm('确定要清空购物车吗？')) {
                return;
            }
            
            fetch('/order/clearCart', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/x-www-form-urlencoded'
                }
            }).then(response => response.text())
              .then(data => {
                  if (data === 'success') {
                      location.reload();
                  }
              });
        }
        
        // 清空购物车
        function clearCart() {
            if (confirm('确定要清空购物车吗？')) {
                fetch('/order/clearCart?userId=1', {
                    method: 'POST'
                }).then(response => response.text())
                  .then(data => {
                      if (data === 'success') {
                          location.reload();
                      }
                  });
            }
        }
        
        // 更新结算按钮
        function updateCheckoutButton() {
            const checkedBoxes = document.querySelectorAll('.item-checkbox:checked');
            const checkoutBtn = document.querySelector('.checkout-btn');
            
            if (checkedBoxes.length === 0) {
                checkoutBtn.style.pointerEvents = 'none';
                checkoutBtn.style.opacity = '0.5';
                checkoutBtn.onclick = function(e) {
                    e.preventDefault();
                    alert('请先选择要结算的商品');
                };
            } else {
                checkoutBtn.style.pointerEvents = 'auto';
                checkoutBtn.style.opacity = '1';
                checkoutBtn.onclick = function(e) {
                    // 阻止默认行为
                    e.preventDefault();
                    
                    // 获取选中的商品ID
                    const selectedIds = Array.from(checkedBoxes).map(cb => cb.value);
                    
                    // 跳转到结算页面并传递选中的商品ID
                    const userId = new URLSearchParams(window.location.search).get('userId');
                    window.location.href = '/order/confirm?userId=' + userId + '&selectedItems=' + selectedIds.join(',');
                };
            }
        }
        
        // 清空购物车
        function clearCart() {
            if (confirm('确定要清空购物车吗？')) {
                fetch('/order/clearCart?userId=1', {
                    method: 'POST'
                }).then(response => response.text())
                  .then(data => {
                      if (data === 'success') {
                          location.reload();
                      }
                  });
            }
        }
        
        // 全选/取消全选
        function toggleSelectAll() {
            const selectAll = document.getElementById('selectAll');
            const checkboxes = document.querySelectorAll('.cart-checkbox');
            checkboxes.forEach(cb => {
                cb.checked = selectAll.checked;
            });
        }
        
        // 批量删除
        function batchDelete() {
            const checkedBoxes = document.querySelectorAll('.cart-checkbox:checked');
            if (checkedBoxes.length === 0) {
                alert('请先选择要删除的商品');
                return;
            }
            
            if (confirm('确定要删除选中的商品吗？')) {
                const ids = Array.from(checkedBoxes).map(cb => cb.value);
                fetch('/order/batchDeleteCart', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/x-www-form-urlencoded'
                    },
                    body: 'ids=' + ids.join(',')
                }).then(response => response.text())
                  .then(data => {
                      if (data === 'success') {
                          location.reload();
                      }
                  });
            }
        }
    </script>
</body>
</html>
