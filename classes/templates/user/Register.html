<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>注册 - 电商系统</title>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <style>
        body { background: #f5f7fa; }
        .reg-card { max-width: 440px; margin: 60px auto; border-radius:12px;
            box-shadow: 0 4px 24px rgba(0,0,0,.10); }
        #tips { font-size:.85rem; }
    </style>
</head>
<body>
<div class="card reg-card p-4">
    <h4 class="text-center mb-4 fw-bold">🛒 注 册</h4>

    <div class="mb-3">
        <input id="username" type="text" class="form-control" placeholder="用户名（3-20位）">
    </div>
    <div class="mb-3">
        <input id="email" type="email" class="form-control" placeholder="邮箱（用于验证）">
    </div>
    <div class="mb-3 input-group">
        <input id="code" type="text" class="form-control" placeholder="6位验证码" maxlength="6">
        <button class="btn btn-outline-secondary" id="btnCode" onclick="sendCode()">发送验证码</button>
    </div>
    <div class="mb-3">
        <input id="password" type="password" class="form-control" placeholder="密码（6-20位）">
    </div>
    <div class="mb-3">
        <input id="phone" type="text" class="form-control" placeholder="手机号（可选）">
    </div>
    <button class="btn btn-success w-100" onclick="doRegister()">立即注册</button>

    <div id="tips" class="mt-3 text-center"></div>
    <div class="text-center mt-2"><small>已有账号？<a href="/user/login">去登录</a></small></div>
</div>

<script>
    let countdown = 0;

    async function postJson(url, data) {
        const r = await fetch(url, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(data)
        });
        return await r.json();
    }

    async function sendCode() {
        if (countdown > 0) return;
        const email = document.getElementById('email').value.trim();
        if (!email) { tip('请先填写邮箱'); return; }
        const data = await postJson(
            '/user/sendCode?email=' + encodeURIComponent(email) + '&type=REGISTER', {});
        if (data.code === 200) {
            tip('验证码已发送', true);
            countdown = 60;
            const btn = document.getElementById('btnCode');
            const t = setInterval(() => {
                btn.textContent = countdown-- + 's';
                btn.disabled = true;
                if (countdown < 0) {
                    clearInterval(t);
                    btn.textContent = '发送验证码';
                    btn.disabled = false;
                }
            }, 1000);
        } else { tip(data.msg); }
    }

    async function doRegister() {
        const body = {
            username: document.getElementById('username').value.trim(),
            email:    document.getElementById('email').value.trim(),
            code:     document.getElementById('code').value.trim(),
            password: document.getElementById('password').value,
            phone:    document.getElementById('phone').value.trim()
        };
        const res = await fetch('/user/register', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(body)
        });
        const data = await res.json();
        if (data.code === 200) {
            tip('注册成功！2秒后跳转登录…', true);
            setTimeout(() => location.href = '/user/login', 2000);
        } else { tip(data.msg); }
    }

    function tip(msg, ok = false) {
        const el = document.getElementById('tips');
        el.style.color = ok ? '#198754' : '#dc3545';
        el.textContent = msg;
    }
</script>
</body>
</html>
