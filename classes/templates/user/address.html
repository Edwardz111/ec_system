<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>收货地址管理</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <style>
        body { background: #f0f2f5; }
        .address-card {
            border: 2px solid #e5e5e5;
            padding: 20px;
            margin-bottom: 15px;
            border-radius: 10px;
            transition: all 0.2s;
            position: relative;
            background: #fff;
        }
        .address-card.default-card { border-color: #0d6efd; background-color: #f8f9ff; }
        .address-card:hover { border-color: #0d6efd; box-shadow: 0 2px 10px rgba(13,110,253,.1); }
        .default-badge {
            position: absolute; top: -11px; right: 18px;
            background: #0d6efd; color: #fff;
            padding: 3px 12px; border-radius: 12px; font-size: 12px;
        }
        .add-card {
            border: 2px dashed #d0d0d0; border-radius: 10px;
            min-height: 160px; display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            cursor: pointer; transition: all 0.2s; background: #fff;
        }
        .add-card:hover { border-color: #0d6efd; color: #0d6efd; }
        .add-card .add-icon { font-size: 2.4rem; }
        .empty-tip { text-align: center; padding: 60px 0; color: #999; }
    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-primary px-4">
    <a class="navbar-brand fw-bold" href="/index">🛒 电商系统</a>
    <div class="ms-auto d-flex gap-3">
        <a class="btn btn-warning btn-sm" id="backConfirmBtn" style="display:none" href="#">← 返回订单确认</a>
        <a class="btn btn-outline-light btn-sm" href="/index">← 返回首页</a>
        <a class="btn btn-outline-light btn-sm" href="/product/list">商品列表</a>
        <a class="btn btn-outline-light btn-sm" href="/order/list?userId=0" id="orderLink">我的订单</a>
    </div>
</nav>

<div class="container py-4" style="max-width:900px">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h4 class="fw-bold mb-0">📍 收货地址管理</h4>
        <button class="btn btn-primary" onclick="openAdd()">➕ 添加新地址</button>
    </div>

    <!-- 地址列表 -->
    <div class="row g-3" id="addressList">
        <div class="col-12 empty-tip" id="emptyTip" style="display:none">
            <p class="fs-5">暂无收货地址，点击右上角添加</p>
        </div>
    </div>
</div>

<!-- 添加/编辑 Modal -->
<div class="modal fade" id="addrModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="modalTitle">添加收货地址</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <input type="hidden" id="editId">
                <div class="row g-3">
                    <div class="col-6">
                        <label class="form-label">收货人 <span class="text-danger">*</span></label>
                        <input type="text" class="form-control" id="fReceiver" placeholder="收货人姓名">
                    </div>
                    <div class="col-6">
                        <label class="form-label">手机号 <span class="text-danger">*</span></label>
                        <input type="tel" class="form-control" id="fPhone" placeholder="11位手机号">
                    </div>
                    <div class="col-4">
                        <label class="form-label">省份 <span class="text-danger">*</span></label>
                        <input type="text" class="form-control" id="fProvince" placeholder="如：广东省">
                    </div>
                    <div class="col-4">
                        <label class="form-label">城市 <span class="text-danger">*</span></label>
                        <input type="text" class="form-control" id="fCity" placeholder="如：深圳市">
                    </div>
                    <div class="col-4">
                        <label class="form-label">区/县 <span class="text-danger">*</span></label>
                        <input type="text" class="form-control" id="fDistrict" placeholder="如：南山区">
                    </div>
                    <div class="col-12">
                        <label class="form-label">详细地址 <span class="text-danger">*</span></label>
                        <textarea class="form-control" id="fDetail" rows="2" placeholder="街道、楼栋、门牌号等"></textarea>
                    </div>
                    <div class="col-6">
                        <label class="form-label">邮政编码</label>
                        <input type="text" class="form-control" id="fPostalCode" placeholder="选填">
                    </div>
                    <div class="col-6 d-flex align-items-end">
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" id="fIsDefault">
                            <label class="form-check-label" for="fIsDefault">设为默认地址</label>
                        </div>
                    </div>
                </div>
                <div id="formError" class="text-danger mt-2" style="display:none"></div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
                <button type="button" class="btn btn-primary" onclick="saveAddress()">保存</button>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    let addrModal;
    let addresses = [];

    // ── 初始化 ─────────────────────────────────────
    document.addEventListener('DOMContentLoaded', async () => {
        addrModal = new bootstrap.Modal(document.getElementById('addrModal'));
        const params = new URLSearchParams(window.location.search);
        const redirect = params.get('redirect');
        if (redirect) {
            const backBtn = document.getElementById('backConfirmBtn');
            backBtn.style.display = '';
            backBtn.href = decodeURIComponent(redirect);
        }
        await loadAddresses();
    });

    // ── 加载地址列表 ────────────────────────────────
    async function loadAddresses() {
        const res = await fetch('/user/address/list');
        const json = await res.json();
        if (json.code !== 200) {
            if (json.code === 401) { location.href = '/user/login'; return; }
            showToast('加载失败：' + json.msg, 'danger');
            return;
        }
        addresses = json.data || [];
        renderList();
    }

    function renderList() {
        const container = document.getElementById('addressList');
        const empty = document.getElementById('emptyTip');

        // 清除旧卡片（保留 emptyTip）
        [...container.querySelectorAll('.addr-col')].forEach(el => el.remove());

        if (addresses.length === 0) {
            empty.style.display = '';
            return;
        }
        empty.style.display = 'none';

        // 默认地址排最前
        const sorted = [...addresses].sort((a, b) => (b.isDefault || 0) - (a.isDefault || 0));
        sorted.forEach(addr => {
            const col = document.createElement('div');
            col.className = 'col-md-6 addr-col';
            col.innerHTML = buildCard(addr);
            container.appendChild(col);
        });

        // 末尾加"添加"卡片
        const addCol = document.createElement('div');
        addCol.className = 'col-md-6 addr-col';
        addCol.innerHTML = `
            <div class="add-card" onclick="openAdd()">
                <div class="add-icon">➕</div>
                <p class="text-muted mt-2 mb-0">点击添加新地址</p>
            </div>`;
        container.appendChild(addCol);
    }

    function buildCard(addr) {
        const isDefault = addr.isDefault === 1;
        return `
        <div class="address-card ${isDefault ? 'default-card' : ''}">
            ${isDefault ? '<span class="default-badge">默认</span>' : ''}
            <div class="fw-semibold fs-6 mb-1">
                ${escHtml(addr.receiver)}
                <span class="text-muted fw-normal ms-2">${escHtml(addr.phone)}</span>
            </div>
            <div class="text-secondary small mb-3">
                ${escHtml(addr.province)} ${escHtml(addr.city)} ${escHtml(addr.district)}<br>
                ${escHtml(addr.detail)}
                ${addr.postalCode ? '<span class="ms-1 text-muted">' + escHtml(addr.postalCode) + '</span>' : ''}
            </div>
            <div class="d-flex gap-2 flex-wrap">
                <button class="btn btn-sm btn-outline-primary" onclick="openEdit(${addr.id})">编辑</button>
                <button class="btn btn-sm btn-outline-danger" onclick="deleteAddr(${addr.id})">删除</button>
                ${!isDefault ? `<button class="btn btn-sm btn-outline-secondary" onclick="setDefault(${addr.id})">设为默认</button>` : ''}
            </div>
        </div>`;
    }

    // ── 打开添加 ────────────────────────────────────
    function openAdd() {
        document.getElementById('modalTitle').textContent = '添加收货地址';
        document.getElementById('editId').value = '';
        clearForm();
        document.getElementById('formError').style.display = 'none';
        addrModal.show();
    }

    // ── 打开编辑 ────────────────────────────────────
    function openEdit(id) {
        const addr = addresses.find(a => a.id === id);
        if (!addr) return;
        document.getElementById('modalTitle').textContent = '编辑收货地址';
        document.getElementById('editId').value = id;
        document.getElementById('fReceiver').value = addr.receiver || '';
        document.getElementById('fPhone').value = addr.phone || '';
        document.getElementById('fProvince').value = addr.province || '';
        document.getElementById('fCity').value = addr.city || '';
        document.getElementById('fDistrict').value = addr.district || '';
        document.getElementById('fDetail').value = addr.detail || '';
        document.getElementById('fPostalCode').value = addr.postalCode || '';
        document.getElementById('fIsDefault').checked = addr.isDefault === 1;
        document.getElementById('formError').style.display = 'none';
        addrModal.show();
    }

    // ── 保存（新增 or 更新）────────────────────────
    async function saveAddress() {
        const receiver = document.getElementById('fReceiver').value.trim();
        const phone    = document.getElementById('fPhone').value.trim();
        const province = document.getElementById('fProvince').value.trim();
        const city     = document.getElementById('fCity').value.trim();
        const district = document.getElementById('fDistrict').value.trim();
        const detail   = document.getElementById('fDetail').value.trim();

        if (!receiver || !phone || !province || !city || !district || !detail) {
            showFormError('请填写所有必填项');
            return;
        }
        if (!/^1\d{10}$/.test(phone)) {
            showFormError('手机号格式不正确');
            return;
        }

        const body = {
            receiver, phone, province, city, district, detail,
            postalCode: document.getElementById('fPostalCode').value.trim(),
            isDefault: document.getElementById('fIsDefault').checked ? 1 : 0
        };

        const editId = document.getElementById('editId').value;
        let url, method;
        if (editId) {
            body.id = parseInt(editId);
            url = '/user/address/update';
            method = 'PUT';
        } else {
            url = '/user/address/add';
            method = 'POST';
        }

        const res = await fetch(url, {
            method,
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(body)
        });
        const json = await res.json();
        if (json.code !== 200) {
            showFormError(json.msg || '保存失败');
            return;
        }
        addrModal.hide();
        showToast(editId ? '地址已更新' : '地址添加成功', 'success');
        await loadAddresses();
        const params = new URLSearchParams(window.location.search);
        const redirect = params.get('redirect');
        if (redirect && !editId) {
            setTimeout(function() {
                location.href = decodeURIComponent(redirect);
            }, 600);
        }
    }

    // ── 删除 ───────────────────────────────────────
    async function deleteAddr(id) {
        if (!confirm('确定要删除这个收货地址吗？')) return;
        const res = await fetch('/user/address/delete?id=' + id, { method: 'DELETE' });
        const json = await res.json();
        if (json.code !== 200) { showToast('删除失败：' + json.msg, 'danger'); return; }
        showToast('地址已删除', 'success');
        await loadAddresses();
    }

    // ── 设为默认 ───────────────────────────────────
    async function setDefault(id) {
        const res = await fetch('/user/address/setDefault?id=' + id, { method: 'PUT' });
        const json = await res.json();
        if (json.code !== 200) { showToast('操作失败：' + json.msg, 'danger'); return; }
        showToast('已设为默认地址', 'success');
        await loadAddresses();
    }

    // ── 工具函数 ───────────────────────────────────
    function clearForm() {
        ['fReceiver','fPhone','fProvince','fCity','fDistrict','fDetail','fPostalCode']
            .forEach(id => document.getElementById(id).value = '');
        document.getElementById('fIsDefault').checked = false;
    }

    function showFormError(msg) {
        const el = document.getElementById('formError');
        el.textContent = msg;
        el.style.display = '';
    }

    function escHtml(s) {
        return (s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }

    function showToast(msg, type = 'success') {
        const id = 'toast_' + Date.now();
        const div = document.createElement('div');
        div.innerHTML = `
            <div id="${id}" class="toast align-items-center text-bg-${type} border-0 show"
                 style="position:fixed;bottom:24px;right:24px;z-index:9999;min-width:220px">
                <div class="d-flex">
                    <div class="toast-body">${msg}</div>
                    <button type="button" class="btn-close btn-close-white me-2 m-auto"
                            onclick="this.closest('.toast').remove()"></button>
                </div>
            </div>`;
        document.body.appendChild(div);
        setTimeout(() => div.remove(), 3000);
    }
</script>
</body>
</html>
