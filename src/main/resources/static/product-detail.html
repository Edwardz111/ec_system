<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <title>商品详情</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
    <style>
        body { background-color: #f5f5f5; }
        .navbar-brand { font-weight: 700; color: #ff5000 !important; }
        .detail-container { background-color: #fff; border-radius: 6px; padding: 16px; margin-top: 16px; }
        .detail-image-placeholder { width: 100%; padding-top: 100%; background: linear-gradient(135deg, #ffd1e3, #d1e8ff); border-radius: 6px; }
        .price { color: #ff5000; font-size: 22px; font-weight: 700; }
        .meta { color: #777; font-size: 14px; }
        .btn-cart { background-color: #ff5000; border-color: #ff5000; }
        .btn-cart:hover { background-color: #e64800; border-color: #e64800; }
        .review-section { margin-top: 20px; padding-top: 16px; border-top: 1px solid #eee; }
        .stars { color: #ffb400; font-size: 18px; letter-spacing: 2px; }
        .stars .empty { color: #ddd; }
        .review-item { border-bottom: 1px solid #f0f0f0; padding: 12px 0; }
        .review-item:last-child { border-bottom: none; }
        .review-rating { color: #ffb400; font-weight: 600; }
        .review-meta { color: #999; font-size: 12px; }
    </style>
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm">
    <div class="container">
        <a class="navbar-brand" href="/index.html">校园电商</a>
        <span class="navbar-text me-auto ms-3">商品详情</span>
        <div id="navUserArea" class="d-flex align-items-center"></div>
    </div>
</nav>

<div class="container detail-container">
    <div class="row">
        <div class="col-md-5 mb-3">
            <div class="detail-image-placeholder"></div>
        </div>
        <div class="col-md-7">
            <h4 id="productName">加载中...</h4>
            <p id="productDesc" class="text-muted"></p>
            <div class="price mb-2" id="productPrice"></div>
            <div class="meta mb-3" id="productMeta"></div>
            <div class="mb-3" id="productCategory"></div>
            <div class="d-flex align-items-center mb-3">
                <label class="me-2 text-muted">数量</label>
                <input type="number" id="quantityInput" class="form-control form-control-sm" style="width:80px" value="1" min="1" max="99" />
            </div>
            <button type="button" id="btnAddCart" class="btn btn-cart text-white me-2">加入购物车</button>
            <button type="button" class="btn btn-outline-secondary" onclick="history.back()">返回上一页</button>

            <div class="review-section">
                <h5 class="mb-2">商品评价</h5>
                <div class="d-flex align-items-center mb-2 flex-wrap gap-2">
                    <span id="starDisplay" class="stars">★★★★★</span>
                    <span id="avgScoreText" class="fw-semibold text-warning">5.0</span>
                    <span class="text-muted" id="reviewCountText">（暂无评价，默认满分）</span>
                </div>
                <div id="reviewList"></div>
            </div>
        </div>
    </div>
</div>

<script src="/js/cart.js"></script>
<script>
    let currentProduct = null;

    document.addEventListener('DOMContentLoaded', () => {
        CartUtil.initNavbar(document.getElementById('navUserArea'));
        const params = new URLSearchParams(window.location.search);
        const id = params.get('id');
        if (!id) {
            document.getElementById('productName').textContent = '未指定商品';
            return;
        }
        loadProduct(id);
        loadReviews(id);
        document.getElementById('btnAddCart').addEventListener('click', onAddCart);
    });

    function renderStars(avg) {
        const full = Math.round(avg);
        let html = '';
        for (let i = 1; i <= 5; i++) {
            html += i <= full ? '★' : '<span class="empty">★</span>';
        }
        return html;
    }

    function loadReviews(productId) {
        Promise.all([
            fetch('/api/products/' + productId + '/reviews-summary-temp').then(r => r.json()),
            fetch('/api/products/' + productId + '/reviews-temp?limit=20').then(r => r.json())
        ]).then(([summary, reviews]) => {
            let count = Number(summary.reviewCount || 0);
            let avg = Number(summary.avgRating);
            if (!count || isNaN(avg) || avg <= 0) {
                avg = 5;
                count = 0;
            }
            document.getElementById('starDisplay').innerHTML = renderStars(avg);
            document.getElementById('avgScoreText').textContent = avg.toFixed(1) + ' 分';
            document.getElementById('reviewCountText').textContent =
                count > 0 ? `（共 ${count} 条评价）` : '（暂无评价，默认满分）';

            const listEl = document.getElementById('reviewList');
            if (!reviews || reviews.length === 0) {
                listEl.innerHTML = '<p class="text-muted small mb-0">还没有用户留言，欢迎购买后评价。</p>';
                return;
            }
            listEl.innerHTML = reviews.map(r => {
                const rating = r.rating != null ? r.rating : 5;
                const content = (r.content && String(r.content).trim()) ? r.content : '用户未填写文字评价';
                const time = r.createdAt ? String(r.createdAt).replace('T', ' ').slice(0, 16) : '';
                return `<div class="review-item">
                    <div><span class="review-rating">${rating} 星</span>
                    <span class="review-meta ms-2">用户 ${r.userId != null ? r.userId : '-'}</span></div>
                    <div class="mt-1">${escapeHtml(content)}</div>
                    ${time ? `<div class="review-meta mt-1">${time}</div>` : ''}
                    ${r.reply ? `<div class="text-primary small mt-1">商家回复：${escapeHtml(r.reply)}</div>` : ''}
                </div>`;
            }).join('');
        }).catch(err => {
            console.error('加载评价失败', err);
            document.getElementById('starDisplay').innerHTML = renderStars(5);
            document.getElementById('avgScoreText').textContent = '5.0 分';
            document.getElementById('reviewCountText').textContent = '（暂无评价，默认满分）';
            document.getElementById('reviewList').innerHTML = '<p class="text-muted small">评价加载失败</p>';
        });
    }

    function escapeHtml(s) {
        return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }

    function loadProduct(id) {
        fetch('/api/products/' + id)
            .then(r => r.json())
            .then(p => {
                currentProduct = p;
                document.getElementById('productName').textContent = p.name;
                document.getElementById('productDesc').textContent = p.description || '暂无描述';
                document.getElementById('productPrice').textContent = '￥' + Number(p.price).toFixed(2);
                const sales = p.salesVolume != null ? p.salesVolume : 0;
                document.getElementById('productMeta').textContent = `库存：${p.stock}   |   销量：${sales}`;
                const catDiv = document.getElementById('productCategory');
                if (p.category) {
                    catDiv.textContent = '所属分类：' + p.category.name + '（ID: ' + p.category.categoryId + '）';
                } else {
                    catDiv.textContent = '所属分类：未分类';
                }
                const maxQ = Math.max(1, p.stock || 99);
                document.getElementById('quantityInput').max = maxQ;
            })
            .catch(err => {
                console.error('加载商品详情失败', err);
                document.getElementById('productName').textContent = '商品加载失败';
            });
    }

    async function onAddCart() {
        if (!currentProduct) return;
        const qty = parseInt(document.getElementById('quantityInput').value, 10) || 1;
        if (qty < 1) {
            CartUtil.showToast('数量至少为 1', false);
            return;
        }
        if (currentProduct.stock != null && qty > currentProduct.stock) {
            CartUtil.showToast('超过库存数量', false);
            return;
        }
        const ok = await CartUtil.addToCart(currentProduct, qty);
        if (ok) {
            CartUtil.showToast('已加入购物车', true);
            const userId = await CartUtil.getUserId();
            if (userId && confirm('是否前往购物车结算？')) {
                location.href = CartUtil.cartUrl(userId);
            }
        }
    }
</script>
</body>
</html>
