<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>订单管理</title>

    <style>

        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body{
            display: flex;
            height: 100vh;
            background-color: #f4f6f9;
        }

        /* 左侧侧边栏 */

        .sidebar{
            width: 20%;
            background-color: rgba(3, 68, 248, 0.83);
            color: white;
            padding: 20px;
        }

        .sidebar h2{
            text-align: center;
            margin-bottom: 40px;
            font-size: 28px;
            font-weight: bold;
        }

        .sidebar ul{
            list-style: none;
        }

        .sidebar li{
            background-color: #3498db;
            padding: 15px;
            margin-bottom: 15px;
            border-radius: 8px;
            text-align: center;
            cursor: pointer;
            transition: 0.3s;
            font-size: 18px;
        }

        .sidebar li:hover{
            background-color: #3770d2;
        }

        /* 主体区域 */

        .main{
            width: 80%;
            padding: 25px;
        }

        /* 页面标题 */

        .header{
            background-color: white;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
            box-shadow: 0 0 5px rgba(0,0,0,0.1);
        }

        .header h1{
            color: #2c3e50;
            margin-bottom: 10px;
        }

        .header p{
            color: gray;
        }

        /* 搜索区域 */

        .search-box{
            background-color: white;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
            box-shadow: 0 0 5px rgba(0,0,0,0.1);
        }

        .search-box input,
        .search-box select{
            padding: 10px;
            margin-right: 15px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        .search-box button{
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            background-color: #3498db;
            color: white;
            cursor: pointer;
            transition: 0.3s;
        }

        .search-box button:hover{
            background-color: #3770d2;
        }

        /* 数据统计 */

        .statistics{
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
        }

        .card{
            flex: 1;
            background-color: white;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            box-shadow: 0 0 5px rgba(0,0,0,0.1);
        }

        .card h3{
            color: gray;
            margin-bottom: 10px;
        }

        .card p{
            font-size: 28px;
            color: #3498db;
            font-weight: bold;
        }

        /* 表格区域 */

        .table-box{
            background-color: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 5px rgba(0,0,0,0.1);
        }

        table{
            width: 100%;
            border-collapse: collapse;
        }

        table th,
        table td{
            padding: 15px;
            border-bottom: 1px solid #ddd;
            text-align: center;
        }

        table th{
            background-color: #f1f2f6;
            color: #2c3e50;
        }

        /* 状态颜色 */

        .paid{
            color: green;
            font-weight: bold;
        }

        .paying{
            color: orange;
            font-weight: bold;
        }

        .unpaid{
            color: red;
            font-weight: bold;
        }

        .shipping{
            color: #3498db;
            font-weight: bold;
        }

        .delivered{
            color: green;
            font-weight: bold;
        }

        /* 操作按钮 */

        .action-btn{
            padding: 6px 12px;
            border: none;
            border-radius: 5px;
            color: white;
            cursor: pointer;
            margin: 0 3px;
        }

        .detail-btn{
            background-color: #3498db;
        }

        .ship-btn{
            background-color: #2ecc71;
        }

        .cancel-btn{
            background-color: #e74c3c;
        }

        /* 分页 */

        .pagination{
            margin-top: 20px;
            text-align: center;
        }

        .pagination button{
            padding: 8px 15px;
            margin: 0 5px;
            border: none;
            border-radius: 5px;
            background-color: #3498db;
            color: white;
            cursor: pointer;
        }

        .pagination button:hover{
            background-color: #3770d2;
        }

    </style>

</head>

<body>

<!-- 只修改左侧导航栏部分，其他保持不变 -->
<div class="sidebar">
    <h2>后台管理</h2>
    <ul>
        <li><a href="/admin/dashboard">首页</a></li>
        <li><a href="/admin/users">用户管理</a></li>
        <li><a href="/admin/products">商品管理</a></li>
        <li><a href="/admin/orders">订单管理</a></li>
        <li><a href="/admin/reviews">评价管理</a></li>
    </ul>
</div>

<!-- 主体区域 -->

<div class="main">

    <!-- 页面标题 -->

    <div class="header">

        <h1>订单管理</h1>

        <p>管理员可查看并管理平台订单信息</p>

    </div>

    <!-- 搜索区域 -->

    <div class="search-box">

        <input type="text" placeholder="请输入订单ID">

        <input type="text" placeholder="请输入用户ID">

        <select>
            <option>全部订单状态</option>
            <option>已付款</option>
            <option>正在支付</option>
            <option>未支付</option>
        </select>

        <select>
            <option>全部运输状态</option>
            <option>待发货</option>
            <option>运输中</option>
            <option>已送达</option>
        </select>

        <button>搜索</button>

    </div>

    <!-- 数据统计 -->

    <div class="statistics">

        <div class="card">
            <h3>订单总数</h3>
            <p th:text="${orderTotal}">0</p>
        </div>

        <div class="card">
            <h3>已付款/待发货</h3>
            <p th:text="${paidOrderCount}">0</p>
        </div>

        <div class="card">
            <h3>待发货订单</h3>
            <p th:text="${pendingShipCount}">0</p>
        </div>

    </div>

    <!-- 表格区域 -->

    <div class="table-box">

        <table>

            <thead>

            <tr>
                <th>订单ID</th>
                <th>用户ID</th>
                <th>订单总额</th>
                <th>订单状态</th>
                <th>付款方式</th>
                <th>运输状态</th>
                <th>优惠金额</th>
                <th>创建时间</th>
                <th>操作</th>
            </tr>

            </thead>

            <tbody>
            <tr th:if="${#lists.isEmpty(orderList)}">
                <td colspan="9" style="text-align:center;color:#999;">暂无订单数据</td>
            </tr>
            <tr th:each="o : ${orderList}">
                <td th:text="${o.id}"></td>
                <td th:text="${o.userId}"></td>
                <td th:text="${o.totalAmount != null ? '￥' + o.totalAmount : '-'}"></td>
                <td th:text="${o.status == '1' ? '待付款' : (o.status == '2' ? '待发货' : (o.status == '3' ? '待收货' : (o.status == 'CANCELLED' ? '已取消' : o.status)))}"></td>
                <td th:text="${o.paymentMethod != null ? o.paymentMethod : '-'}"></td>
                <td th:text="${o.shippingStatus != null ? o.shippingStatus : '-'}"></td>
                <td th:text="${o.discountAmount != null ? '￥' + o.discountAmount : '￥0'}"></td>
                <td th:text="${o.createdAt != null ? #temporals.format(o.createdAt,'yyyy-MM-dd HH:mm') : '-'}"></td>
                <td>
                    <a class="action-btn detail-btn" th:href="@{/admin/orders/detail(id=${o.id})}">详情</a>
                </td>
            </tr>
            </tbody>

        </table>

        <!-- 分页 -->

        <div class="pagination">

            <button>上一页</button>
            <button>1</button>
            <button>2</button>
            <button>下一页</button>

        </div>

    </div>

</div>

</body>
</html>
