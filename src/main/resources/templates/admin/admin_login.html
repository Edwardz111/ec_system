<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>管理员登录入口</title>
    <style>
        .system-title {
            position: fixed;
            top: 30px;
            left: 40px;
            font-size: 24px;
            font-weight: bold;
            color: #2c3e50;
        }
        .system-title span {
            color: #3498db; /* 主题蓝色 */
            font-weight: normal;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #6696cf;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .login-wrapper {
            display: flex;
            justify-content: flex-end;
            width: 90%;
            max-width: 1200px;
        }

        .login-box {
            width: 350px;
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 5px 20px rgba(5, 5, 5, 0.08);
        }

        h2 {
            text-align: center;
            margin-bottom: 25px;
            color: #2c3e50;
        }

        input {
            width: 100%;
            padding: 12px 15px; /* 略微增加内边距 */
            margin-bottom: 20px;
            border: 1px solid #050404;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 16px;
        }
        input:focus {
            outline: none;
            border-color: #3498db; /* 聚焦时使用主题蓝色 */
        }

        button {
            width: 100%;
            padding: 12px;
            border: none;
            background-color: #3498db; /* 使用更鲜明的蓝色 */
            color: white;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            transition: background-color 0.2s;
        }

        button:hover {
            background-color: #2980b9; /* 鼠标悬停时变为深蓝色 */
        }
    </style>
</head>
<body>
<!-- 1. 左上角系统名称 -->
<div class="system-title"> Admin管理后台</div>

<div class="login-wrapper">
    <div class="login-box">
        <h2>管理员登录</h2>
        <p th:if="${error}" th:text="${error}" style="color:#c0392b;font-size:14px;margin-bottom:12px;"></p>
        <form action="/admin/login" method="post">
            <input type="text" name="username" placeholder="请输入管理员账号" required>
            <input type="password" name="password" placeholder="请输入密码" required>
            <button type="submit">登录</button>
        </form>
    </div>
</div>
</body>
</html>
